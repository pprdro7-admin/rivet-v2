# Netlify settings for the web app (base directory: web).
[build]
  command = "npm run build"
  publish = "dist"
  # Build only when something under web/ changed: each production deploy spends Netlify credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
